; Firmware do M5Stack Cardputer que funciona como controle remoto do StamPLC
; da Sumiriko. Conecta no AP WiFi do PLC (StamPLC-Sumi / sumi1234) e usa
; as rotas /live.json, /log.txt, /set e /mb pra ver + ajustar tudo.

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    m5stack/M5Cardputer
    m5stack/M5Unified
    m5stack/M5GFX
    bblanchon/ArduinoJson @ ^7.0.0
